<style>
  :root{
    --ink:#0a0813;
    --panel:#1b1430;
    --panel-2:#251c3d;
    --line:rgba(244,239,227,0.08);
    --line-strong:rgba(244,239,227,0.18);

    --neon:#baff3d;
    --neon-dim:rgba(186,255,61,0.16);
    --violet:#8d7bff;
    --violet-dim:rgba(141,123,255,0.18);
    --gold:#e3b767;
    --gold-dim:rgba(227,183,103,0.18);
    --coral:#ff5d78;

    --bone:#f4efe3;
    --dim:#948aae;

    --accent:var(--neon);
    --accent-dim:var(--neon-dim);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(55% 38% at 12% -4%, rgba(141,123,255,0.12), transparent 62%),
      radial-gradient(50% 36% at 88% 0%, rgba(186,255,61,0.09), transparent 60%),
      radial-gradient(70% 55% at 50% 108%, rgba(255,93,120,0.10), transparent 60%),
      var(--ink);
    color:var(--bone);
    font-family:'Manrope',sans-serif;
    display:flex;
    justify-content:center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    transition: background .5s ease;
  }

  body.mode-ruleta{ --accent:var(--neon); --accent-dim:var(--neon-dim); }
  body.mode-moneda{ --accent:var(--gold); --accent-dim:var(--gold-dim); }
  body.mode-dado{ --accent:var(--violet); --accent-dim:var(--violet-dim); }

  .app{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }

  .header{ text-align:center; }

  .eyebrow{
    margin:0 0 6px;
    font-size:11.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--dim);
    font-weight:700;
  }

  .title{
    margin:0;
    font-family:'Unbounded',sans-serif;
    font-weight:800;
    font-size:clamp(25px,7vw,32px);
    line-height:1.06;
    letter-spacing:-0.01em;
  }
  .title span{ color:var(--neon); }

  /* ---------- MODE DOCK ---------- */

  .mode-dock{
    position:relative;
    display:flex;
    width:100%;
    gap:2px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px;
  }

  .mode-indicator{
    position:absolute;
    top:5px; left:5px;
    height:calc(100% - 10px);
    border-radius:999px;
    background:var(--accent);
    box-shadow:0 4px 18px var(--accent-dim), 0 0 0 1px rgba(0,0,0,0.15) inset;
    transition:transform .38s cubic-bezier(.2,.8,.25,1), width .38s cubic-bezier(.2,.8,.25,1), background .4s ease, box-shadow .4s ease;
    z-index:1;
  }

  .mode-tab{
    position:relative;
    z-index:2;
    flex:1;
    appearance:none; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 8px;
    border-radius:999px;
    font-family:'Manrope',sans-serif;
    font-weight:700; font-size:12.5px;
    color:var(--dim);
    cursor:pointer;
    transition:color .3s ease;
  }
  .mode-tab svg{ width:16px; height:16px; flex-shrink:0; }
  .mode-tab.active{ color:var(--ink); }

  /* ---------- STAGE ---------- */

  .stage-shell{
    position:relative;
    width:min(84vw,360px);
    aspect-ratio:1/1;
    margin-top:2px;
  }

  .stage-shell::before{
    content:"";
    position:absolute; inset:-10%;
    background:radial-gradient(circle, var(--accent-dim), transparent 65%);
    filter:blur(4px);
    pointer-events:none;
    transition:background .5s ease;
  }

  .corner{
    position:absolute;
    width:20px; height:20px;
    border:2px solid var(--accent);
    opacity:.8;
    filter:drop-shadow(0 0 6px var(--accent-dim));
    transition:border-color .5s ease, filter .5s ease;
    z-index:4;
  }
  .corner-tl{ top:-2px; left:-2px; border-right:none; border-bottom:none; border-radius:8px 0 0 0; }
  .corner-tr{ top:-2px; right:-2px; border-left:none; border-bottom:none; border-radius:0 8px 0 0; }
  .corner-bl{ bottom:-2px; left:-2px; border-right:none; border-top:none; border-radius:0 0 0 8px; }
  .corner-br{ bottom:-2px; right:-2px; border-left:none; border-top:none; border-radius:0 0 8px 0; }

  .hud-status{
    position:absolute;
    top:12px; left:16px;
    z-index:4;
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--accent);
    transition:color .5s ease;
  }
  .hud-status::before{
    content:"";
    width:6px; height:6px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:.35; } 50%{ opacity:1; } }

  .stage-panel{ position:absolute; inset:0; }
  .stage-panel[hidden]{ display:none; }

  /* ---------- WHEEL ---------- */

  .wheel{
    position:absolute; inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 50% 42%, var(--panel-2), var(--panel) 70%);
    border:2px solid rgba(227,183,103,0.5);
    box-shadow:
      0 0 0 8px rgba(10,8,19,0.9),
      0 0 0 9px rgba(227,183,103,0.22),
      inset 0 0 40px rgba(0,0,0,0.45),
      0 20px 50px rgba(0,0,0,0.55);
  }

  .slot{
    position:absolute; top:50%; left:50%;
    width:62px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    transform:translate(-50%,-50%);
    transition: transform .35s ease;
  }

  .slot .bubble{
    width:34px; height:34px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--ink);
    border:1.5px solid rgba(244,239,227,0.22);
    font-family:'Unbounded',sans-serif;
    font-weight:700; font-size:12.5px;
    color:var(--bone);
    transition: background .3s ease, border-color .3s ease, color .3s ease, box-shadow .3s ease;
  }

  .slot .name{
    font-size:10px; font-weight:700;
    color:var(--dim);
    max-width:62px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:color .3s ease;
  }

  .slot.winner{ transform:translate(-50%,-50%) scale(1.18); z-index:3; }
  .slot.winner .bubble{
    background:var(--coral);
    border-color:var(--coral);
    color:var(--ink);
    box-shadow:0 0 18px rgba(255,93,120,0.75);
  }
  .slot.winner .name{ color:var(--bone); }

  .hub{
    position:absolute; top:50%; left:50%;
    width:30%; height:30%;
    transform:translate(-50%,-50%);
    z-index:2;
  }

  .hub-plate{
    position:absolute; inset:-18%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(10,8,19,0.9), rgba(10,8,19,0.55) 70%, transparent 72%);
  }

  .glass{ position:absolute; inset:0; }

  .liquid{ transform-origin:50% 78%; }
  .spinning .liquid{ animation: slosh 0.5s ease-in-out infinite; }

  @keyframes slosh{
    0%,100%{ transform: rotate(0deg); }
    50%{ transform: rotate(-4deg); }
  }

  .needle{
    position:absolute; bottom:50%; left:50%;
    width:6px; height:145%;
    transform-origin:50% 100%;
    transform:translateX(-50%) rotate(0deg);
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }

  .needle svg{ position:absolute; bottom:0; left:50%; transform:translateX(-50%); overflow:visible; }

  /* ---------- COIN ---------- */

  .coin-wrap{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    perspective:900px;
  }

  .coin-rim{
    position:absolute;
    width:60%; aspect-ratio:1/1;
    border-radius:50%;
    border:3px dashed rgba(227,183,103,0.28);
    pointer-events:none;
  }

  .coin{
    position:relative;
    width:56%;
    aspect-ratio:1/1;
    transform-style:preserve-3d;
    transform:rotateY(0deg);
    filter:drop-shadow(0 18px 32px rgba(0,0,0,0.55));
  }

  .coin-face{
    position:absolute; inset:0;
    border-radius:50%;
    backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
    background:radial-gradient(circle at 34% 28%, #f1d698, var(--gold) 55%, #9c7a34 100%);

  }
  .coin-face svg{ width:44%; height:44%; overflow:visible; }

    font-weight:800;
    font-size:11px;
    letter-spacing:.14em;
    color:rgba(20,14,6,0.72);
  }

  .coin-front{
    box-shadow:
      inset 0 0 14px rgba(0,0,0,0.35),
      inset 0 0 0 6px rgba(20,14,6,0.12),
      inset 0 0 0 2px rgba(186,255,61,0.4);
  }
  .coin-front .coin-glyph path,
  .coin-front .coin-glyph circle{
    stroke:var(--neon);
    filter:drop-shadow(0 0 3px rgba(186,255,61,0.6));
  }

  .coin-back{
    transform:rotateY(180deg);
    box-shadow:
      inset 0 0 14px rgba(0,0,0,0.35),
      inset 0 0 0 6px rgba(20,14,6,0.12),
      inset 0 0 0 2px rgba(141,123,255,0.45);
  }
  .coin-back .coin-glyph path,
  .coin-back .coin-glyph circle{
    stroke:var(--violet);
    filter:drop-shadow(0 0 3px rgba(141,123,255,0.65));
  }

  /* ---------- DICE ---------- */

  .dice-wrap{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    perspective:700px;
  }

  .dice{
    position:relative;
    width:118px; height:118px;
    transform-style:preserve-3d;
    transform:rotateX(0deg) rotateY(0deg);
    filter:drop-shadow(0 20px 30px rgba(0,0,0,0.55));
  }

  .die-face{
    position:absolute; inset:0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    padding:16%;
    background:linear-gradient(150deg, var(--panel-2), var(--panel));
    border:1.5px solid var(--line-strong);
    border-radius:16px;
    box-shadow:inset 0 0 14px rgba(0,0,0,0.4);
  }
  .pip{
    width:100%; aspect-ratio:1/1;
    max-width:16px; max-height:16px;
    border-radius:50%;
    background:var(--bone);
    box-shadow:0 0 6px rgba(244,239,227,0.45);
    align-self:center; justify-self:center;
  }

  .f1{ transform:translateZ(59px); }
  .f6{ transform:rotateY(180deg) translateZ(59px); }
  .f3{ transform:rotateY(90deg) translateZ(59px); }
  .f4{ transform:rotateY(-90deg) translateZ(59px); }
  .f2{ transform:rotateX(90deg) translateZ(59px); }
  .f5{ transform:rotateX(-90deg) translateZ(59px); }

  .p-c1{ grid-column:2; grid-row:2; }
  .p-tl{ grid-column:1; grid-row:1; }
  .p-tr{ grid-column:3; grid-row:1; }
  .p-bl{ grid-column:1; grid-row:3; }
  .p-br{ grid-column:3; grid-row:3; }
  .p-ml{ grid-column:1; grid-row:2; }
  .p-mr{ grid-column:3; grid-row:2; }

  /* ---------- CONTROLS ---------- */

  .action-btn{
    appearance:none; border:none;
    display:flex; align-items:center; justify-content:center; gap:9px;
    font-family:'Unbounded',sans-serif;
    font-weight:800; font-size:15.5px; letter-spacing:.01em;
    color:var(--ink);
    background:var(--neon);
    padding:16px 40px;
    border-radius:999px;
    box-shadow:0 10px 28px rgba(186,255,61,0.25);
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, opacity .2s ease;
  }
  .action-btn svg{ width:18px; height:18px; }
  .action-btn:active{ transform:scale(0.96); }
  .action-btn:disabled{ opacity:.55; cursor:default; transform:none; }

  .result{
    min-height:22px; margin:0;
    font-weight:800; font-size:15.5px;
    color:var(--bone);
    text-align:center;
  }
  .result.show{ color:var(--coral); }

  .edit-toggle{
    appearance:none;
    background:transparent;
    border:1px solid var(--line-strong);
    color:var(--dim);
    font-family:'Manrope',sans-serif;
    font-weight:700; font-size:13px;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
  }

  .editor{
    width:100%;
    background:var(--panel);
    border:1px solid rgba(227,183,103,0.2);
    border-radius:18px;
    padding:16px;
    display:flex; flex-direction:column; gap:10px;
  }
  .editor[hidden]{ display:none; }

  .editor-list{ display:flex; flex-direction:column; gap:8px; }

  .editor-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:rgba(10,8,19,0.5);
    border-radius:10px;
    padding:9px 12px;
  }
  .editor-row span{ font-weight:700; font-size:14px; }

  .row-remove{
    appearance:none; border:none; background:transparent;
    color:var(--dim); font-size:16px; line-height:1;
    cursor:pointer; padding:4px 6px;
  }
  .row-remove:hover{ color:var(--coral); }

  .editor-add{ display:flex; gap:8px; margin-top:4px; }

  .editor-add input{
    flex:1;
    background:rgba(10,8,19,0.6);
    border:1px solid rgba(244,239,227,0.18);
    border-radius:10px;
    padding:10px 12px;
    color:var(--bone);
    font-family:'Manrope',sans-serif;
    font-weight:600; font-size:14px;
  }
  .editor-add input::placeholder{ color:var(--dim); }

  .editor-add button{
    appearance:none; border:none;
    background:var(--gold);
    color:var(--ink);
    font-weight:800;
    border-radius:10px;
    padding:0 16px;
    cursor:pointer;
  }

  .editor-hint{ font-size:11px; color:var(--dim); margin:2px 2px 0; }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  /* ---------- CELEBRATION OVERLAY ---------- */

  .celebrate{
    position:fixed; inset:0;
    z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(10,8,19,0.82);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    opacity:0;
    transition:opacity .25s ease;
    padding:20px;
  }
  .celebrate[hidden]{ display:none; }
  .celebrate.show{ opacity:1; }

  .confetti{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }

  .confetti-piece{
    position:absolute;
    top:-10%;
    width:8px; height:14px;
    border-radius:2px;
    animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform: translateY(115vh) rotate(540deg); opacity:.2; }
  }

  .celebrate-card{
    position:relative;
    width:100%; max-width:340px;
    background:radial-gradient(circle at 50% 20%, var(--panel-2), var(--panel) 75%);
    border:1.5px solid rgba(227,183,103,0.5);
    border-radius:24px;
    padding:34px 28px 28px;
    text-align:center;
    box-shadow:0 25px 70px rgba(0,0,0,0.55), 0 0 40px var(--accent-dim);
    transform:scale(.85) translateY(10px);
    opacity:0;
    transition:transform .35s cubic-bezier(.2,.9,.3,1.3), opacity .3s ease, box-shadow .5s ease;
  }
  .celebrate.show .celebrate-card{ transform:scale(1) translateY(0); opacity:1; }

  .celebrate-glass{
    font-size:50px;
    display:inline-block;
    animation: tilt 1s ease-in-out infinite;
  }
  @keyframes tilt{
    0%,100%{ transform:rotate(-6deg); }
    50%{ transform:rotate(6deg); }
  }

  .celebrate-eyebrow{
    margin:14px 0 2px;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--dim);
    font-weight:700;
  }

  .celebrate-name{
    margin:2px 0 10px;
    font-family:'Unbounded',sans-serif;
    font-weight:800;
    font-size:clamp(22px,8vw,30px);
    color:var(--accent);
    line-height:1.1;
    transition:color .5s ease;
    word-break:break-word;
  }

  .celebrate-caption{
    margin:0 0 22px;
    font-size:14.5px;
    font-weight:600;
    color:var(--bone);
    opacity:.9;
  }

  .celebrate-close{
    appearance:none; border:none;
    font-family:'Unbounded',sans-serif;
    font-weight:800; font-size:14px;
    color:var(--ink);
    background:var(--coral);
    padding:13px 32px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(255,93,120,0.3);
  }
  .celebrate-close:active{ transform:scale(0.96); }

  @media (prefers-reduced-motion: reduce){
    .slot, .needle, .coin, .dice{ transition-duration:.01ms !important; }
    .celebrate-glass{ animation:none; }
    .confetti-piece{ animation:none; display:none; }
    .hud-status::before{ animation:none; }
  }
</style>

  function angleFor(i, n){ return (360 / n) * i; }
  function pickRandom(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
  function vibrate(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }
  function prefersReducedMotion(){ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

  /* ---------- RENDER: WHEEL ---------- */

  function renderWheel(){
    wheelEl.innerHTML = '';
    var n = players.length;
    var R = 38;

    players.forEach(function(name, i){
      var rad = (angleFor(i, n) - 90) * Math.PI / 180;
      var x = 50 + R * Math.cos(rad);
      var y = 50 + R * Math.sin(rad);

      var slot = document.createElement('div');
      slot.className = 'slot';
      slot.style.left = x + '%';
      slot.style.top = y + '%';
      slot.dataset.index = i;

      var bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = (name.trim()[0] || '?').toUpperCase();

      var label = document.createElement('div');
      label.className = 'name';
      label.textContent = name;

      slot.appendChild(bubble);
      slot.appendChild(label);
      wheelEl.appendChild(slot);
    });
  }

  /* ---------- RENDER: EDITOR ---------- */

  function renderEditor(){
    editorList.innerHTML = '';
    players.forEach(function(name, i){
      var row = document.createElement('div');
      row.className = 'editor-row';

      var span = document.createElement('span');
      span.textContent = name;

      var removeBtn = document.createElement('button');
      removeBtn.className = 'row-remove';
      removeBtn.setAttribute('aria-label', 'Quitar ' + name);
      removeBtn.textContent = '✕';
      removeBtn.disabled = players.length <= MIN_PLAYERS;
      removeBtn.addEventListener('click', function(){
        players.splice(i, 1);
        savePlayers();
        renderWheel();
        renderEditor();
        resetResult();
      });

      row.appendChild(span);
      row.appendChild(removeBtn);
      editorList.appendChild(row);
    });
    addPlayerBtn.disabled = players.length >= MAX_PLAYERS;
  }

  function addPlayer(){
    var name = newPlayerInput.value.trim();
    if(!name || players.length >= MAX_PLAYERS) return;
    players.push(name);
    savePlayers();
    newPlayerInput.value = '';
    renderWheel();
    renderEditor();
    resetResult();
  }

  /* ---------- MODE SWITCHING ---------- */

  function moveIndicator(){
    var activeTab = modeDock.querySelector('.mode-tab[data-mode="' + currentMode + '"]');
    if(!activeTab) return;
    var dockRect = modeDock.getBoundingClientRect();
    var tabRect = activeTab.getBoundingClientRect();
    modeIndicator.style.width = tabRect.width + 'px';
    modeIndicator.style.transform = 'translateX(' + (tabRect.left - dockRect.left - 5) + 'px)';
  }

  function setAccentOverride(colors){
    body.style.setProperty('--accent', colors.accent);
    body.style.setProperty('--accent-dim', colors.dim);
  }
  function clearAccentOverride(){
    body.style.removeProperty('--accent');
    body.style.removeProperty('--accent-dim');
  }

  function switchMode(mode){
    if(spinning || mode === currentMode) return;
    currentMode = mode;
    saveMode(mode);

    clearAccentOverride();
    body.className = 'mode-' + mode;

    modeTabs.forEach(function(tab){
      var isActive = tab.dataset.mode === mode;
      tab.classList.toggle('active', isActive);
      tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });
    moveIndicator();

    Object.keys(stagePanels).forEach(function(key){
      if(key === mode) stagePanels[key].removeAttribute('hidden');
      else stagePanels[key].setAttribute('hidden', '');
    });

    actionLabel.textContent = ACTION_LABEL[mode];
    actionIcon.innerHTML = ACTION_ICON[mode];
    hudStatus.textContent = HUD_STATUS_IDLE[mode];

    var isRuleta = mode === 'ruleta';
    editToggle.hidden = !isRuleta;
    if(!isRuleta) editor.setAttribute('hidden', '');

    resetResult();
  }

  modeTabs.forEach(function(tab){
    tab.addEventListener('click', function(){ switchMode(tab.dataset.mode); });
  });
  window.addEventListener('resize', moveIndicator);

  /* ---------- RESULT TEXT ---------- */

  function resetResult(){
    if(currentMode === 'ruleta'){
      resultEl.textContent = pickRandom([IDLE_TEXT.ruleta].concat(IDLE_EASTER_EGGS_RULETA, IDLE_TEXT.ruleta, IDLE_TEXT.ruleta));
      var winnerSlot = wheelEl.querySelector('.slot.winner');
      if(winnerSlot) winnerSlot.classList.remove('winner');
    } else {
      resultEl.textContent = IDLE_TEXT[currentMode];
    }
    resultEl.classList.remove('show');
  }

  /* ---------- CELEBRATION OVERLAY ---------- */

  function spawnConfetti(){
    confettiEl.innerHTML = '';
    for(var i = 0; i < CONFETTI_COUNT; i++){
      var piece = document.createElement('span');
      piece.className = 'confetti-piece';
      piece.style.left = (Math.random() * 100) + '%';
      piece.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      piece.style.animationDuration = (1.8 + Math.random() * 1.4) + 's';
      piece.style.animationDelay = (Math.random() * 0.4) + 's';
      piece.style.opacity = String(0.7 + Math.random() * 0.3);
      confettiEl.appendChild(piece);
    }
  }

  function openCelebration(opts){
    celebrateIcon.textContent = opts.icon;
    celebrateEyebrow.textContent = opts.eyebrow;
    celebrateName.textContent = opts.name;
    celebrateCaption.textContent = opts.caption;

    if(!prefersReducedMotion()) spawnConfetti();

    celebrateEl.removeAttribute('hidden');
    requestAnimationFrame(function(){ celebrateEl.classList.add('show'); });
    vibrate([30, 60, 30]);
  }

  function closeCelebration(){
    celebrateEl.classList.remove('show');
    setTimeout(function(){
      celebrateEl.setAttribute('hidden', '');
      confettiEl.innerHTML = '';
      clearAccentOverride();
    }, 250);
  }

  celebrateClose.addEventListener('click', closeCelebration);
  celebrateEl.addEventListener('click', function(e){
    if(e.target === celebrateEl) closeCelebration();
  });

  /* ---------- SPIN: RULETA ---------- */

  function spinWheel(){
    var n = players.length;
    var targetIndex = Math.floor(Math.random() * n);
    if(n > 2 && targetIndex === lastWinner){
      targetIndex = (targetIndex + 1) % n;
    }

    var arc = 360 / n;
    var jitter = (Math.random() - 0.5) * arc * 0.6;
    var targetMod = ((angleFor(targetIndex, n) + jitter) % 360 + 360) % 360;
    var prevMod = ((wheelRotation % 360) + 360) % 360;
    var delta = ((targetMod - prevMod) + 360) % 360;

    wheelRotation += EXTRA_SPINS * 360 + delta;

    var reduceMotion = prefersReducedMotion();
    needleEl.style.transition = reduceMotion
      ? 'transform .01s linear'
      : 'transform ' + (SPIN_DURATION_MS / 1000) + 's cubic-bezier(0.15, 0.65, 0.15, 1)';
    needleEl.style.transform = 'translateX(-50%) rotate(' + wheelRotation + 'deg)';

    hubEl.classList.add('spinning');

    var done = false;
    function finish(){
      if(done) return;
      done = true;
      hubEl.classList.remove('spinning');
      lastWinner = targetIndex;

      var slot = wheelEl.querySelector('.slot[data-index="' + targetIndex + '"]');
      if(slot) slot.classList.add('winner');

      var name = players[targetIndex];
      resultEl.textContent = '🥃 ' + name;
      resultEl.classList.add('show');

      openCelebration({
        icon: '🥃',
        eyebrow: 'Le tocó a',
        name: name,
        caption: pickRandom(WINNER_CAPTIONS)
      });

      endSpin();
    }

    needleEl.addEventListener('transitionend', finish, { once:true });
    setTimeout(finish, reduceMotion ? 100 : SPIN_DURATION_MS + 400);
  }

  /* ---------- SPIN: MONEDA ---------- */

  function spinCoin(){
    var target = Math.random() < 0.5 ? 'cara' : 'cruz';
    if(target === lastCoin && Math.random() < 0.5){
      target = target === 'cara' ? 'cruz' : 'cara';
    }

    var targetMod = target === 'cara' ? 0 : 180;
    var prevMod = ((coinRotation % 360) + 360) % 360;
    var delta = ((targetMod - prevMod) + 360) % 360;

    coinRotation += COIN_EXTRA_SPINS * 360 + delta;

    var reduceMotion = prefersReducedMotion();
    coinEl.style.transition = reduceMotion
      ? 'transform .01s linear'
      : 'transform ' + (COIN_DURATION_MS / 1000) + 's cubic-bezier(0.2, 0.65, 0.2, 1)';
    coinEl.style.transform = 'rotateY(' + coinRotation + 'deg)';

    var done = false;
    function finish(){
      if(done) return;
      done = true;
      lastCoin = target;

      var label = target === 'cara' ? 'CARA' : 'CRUZ';
      resultEl.textContent = (target === 'cara' ? '☀️ ' : '✳️ ') + label;
      resultEl.classList.add('show');

      setAccentOverride(target === 'cara'
        ? { accent:'#baff3d', dim:'rgba(186,255,61,0.16)' }
        : { accent:'#8d7bff', dim:'rgba(141,123,255,0.18)' });

      openCelebration({
        icon: '🪙',
        eyebrow: 'Salió',
        name: label,
        caption: pickRandom(COIN_CAPTIONS)
      });

      endSpin();
    }

    coinEl.addEventListener('transitionend', finish, { once:true });
    setTimeout(finish, reduceMotion ? 100 : COIN_DURATION_MS + 400);
  }

  /* ---------- SPIN: DADO ---------- */

  function rollDice(){
    var target = Math.floor(Math.random() * 6) + 1;
    if(target === lastDice){
      target = (target % 6) + 1;
    }

    var rot = DICE_ROTATIONS[target];
    var prevXmod = ((diceRotX % 360) + 360) % 360;
    var prevYmod = ((diceRotY % 360) + 360) % 360;
    var targetXmod = ((rot.x % 360) + 360) % 360;
    var targetYmod = ((rot.y % 360) + 360) % 360;
    var deltaX = ((targetXmod - prevXmod) + 360) % 360;
    var deltaY = ((targetYmod - prevYmod) + 360) % 360;

    diceRotX += DICE_EXTRA_TURNS * 360 + deltaX;
    diceRotY += DICE_EXTRA_TURNS * 360 + deltaY;

    var reduceMotion = prefersReducedMotion();
    diceEl.style.transition = reduceMotion
      ? 'transform .01s linear'
      : 'transform ' + (DICE_DURATION_MS / 1000) + 's cubic-bezier(0.2, 0.7, 0.25, 1)';
    diceEl.style.transform = 'rotateX(' + diceRotX + 'deg) rotateY(' + diceRotY + 'deg)';

    var done = false;
    function finish(){
      if(done) return;
      done = true;
      lastDice = target;

      resultEl.textContent = '🎲 ' + target;
      resultEl.classList.add('show');

      openCelebration({
        icon: '🎲',
        eyebrow: 'Salió el número',
        name: String(target),
        caption: DICE_CAPTIONS[target]
      });

      endSpin();
    }

    diceEl.addEventListener('transitionend', finish, { once:true });
    setTimeout(finish, reduceMotion ? 100 : DICE_DURATION_MS + 400);
  }

  /* ---------- SPIN ORCHESTRATION ---------- */

  function beginSpin(){
    if(spinning) return false;
    if(currentMode === 'ruleta' && players.length < MIN_PLAYERS) return false;
    spinning = true;
    actionBtn.disabled = true;
    resultEl.classList.remove('show');
    hudStatus.textContent = HUD_STATUS_BUSY[currentMode];
    return true;
  }

  function endSpin(){
    spinning = false;
    actionBtn.disabled = false;
    hudStatus.textContent = HUD_STATUS_IDLE[currentMode];
  }

  function handleAction(){
    if(!beginSpin()) return;
    if(currentMode === 'ruleta') spinWheel();
    else if(currentMode === 'moneda') spinCoin();
    else if(currentMode === 'dado') rollDice();
  }

  /* ---------- EVENTS ---------- */

  actionBtn.addEventListener('click', handleAction);

  editToggle.addEventListener('click', function(){
    var isHidden = editor.hasAttribute('hidden');
    if(isHidden){
      editor.removeAttribute('hidden');
      renderEditor();
      editToggle.textContent = 'Ocultar edición';
    } else {
      editor.setAttribute('hidden', '');
      editToggle.textContent = 'Editar jugadores';
    }
  });

  addPlayerBtn.addEventListener('click', addPlayer);
  newPlayerInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); addPlayer(); }
  });

  /* ---------- INIT ---------- */

  renderWheel();
  body.className = 'mode-' + currentMode;
  modeTabs.forEach(function(tab){
    var isActive = tab.dataset.mode === currentMode;
    tab.classList.toggle('active', isActive);
    tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });
  Object.keys(stagePanels).forEach(function(key){
    if(key === currentMode) stagePanels[key].removeAttribute('hidden');
    else stagePanels[key].setAttribute('hidden', '');
  });
  actionLabel.textContent = ACTION_LABEL[currentMode];
  actionIcon.innerHTML = ACTION_ICON[currentMode];
  hudStatus.textContent = HUD_STATUS_IDLE[currentMode];
  editToggle.hidden = currentMode !== 'ruleta';
  requestAnimationFrame(moveIndicator);
  resetResult();
})();
</script>
</body>
</html>
